name: Data Collection

on:
  schedule:
    # Daily water data: 1 AM UTC (6 PM MST previous day)
    - cron: '0 1 * * *'
    
    # Daily snowpack data: 2 PM UTC (7 AM MST) - captures morning SNOTEL updates
    - cron: '0 14 * * *'
  
  workflow_dispatch:
    inputs:
      job:
        description: 'Which job to run'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - water-data
          - snowpack-data
          - basin-plots
          - water-year-analysis

jobs:
  # ============================================
  # Daily Water Measurements (runs every day)
  # ============================================
  water-data:
    runs-on: ubuntu-latest
    environment: Production
    if: github.event_name == 'schedule' || github.event.inputs.job == 'all' || github.event.inputs.job == 'water-data'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        working-directory: ./data-collection
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run water data collection
        working-directory: ./data-collection
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
        run: |
          echo "📊 Starting daily water data collection..."
          python -m collectors.scheduler
          echo "✅ Water data collection complete"

      # Tell the front-end caches that water-measurements changed (USBR
      # often backfills/corrects past days, not just appends today's row).
      # Without this, the homepage's "Last 7 Days" + weekly-change values
      # can sit stale for up to an hour after the collector runs.
      - name: Revalidate water caches
        if: success()
        env:
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          echo "🔄 Flushing water-measurements caches…"
          curl -fsS -X POST \
            -H "x-revalidate-secret: $REVALIDATE_SECRET" \
            "https://lakepowelldata.com/api/revalidate?tags=water-measurements,latest-measurement,latest-measurement-home,historical-averages,water-year-analysis" \
            && echo "" \
            || echo "⚠️ revalidate call failed (non-fatal — cache will TTL out)"

  # ============================================
  # Daily Snowpack Data (SNOTEL + Basin Plots)
  # ============================================
  snowpack-data:
    runs-on: ubuntu-latest
    environment: Production
    if: github.event_name == 'schedule' || github.event.inputs.job == 'all' || github.event.inputs.job == 'snowpack-data'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        working-directory: ./data-collection
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Update SNOTEL data
        working-directory: ./data-collection
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          echo "❄️ Updating SNOTEL data..."
          python -m migrations.import_snotel_historical_data --end-date $(date +%Y-%m-%d) || echo "⚠️ SNOTEL update had issues (may be upstream data quality)"
          echo "✅ SNOTEL update complete"
      
      - name: Update Basin Plots data
        working-directory: ./data-collection
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          echo "📈 Updating Basin Plots data..."
          python -m migrations.import_basin_plots_data
          echo "✅ Basin Plots update complete"

      - name: Revalidate snowpack caches
        if: success()
        env:
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          echo "🔄 Flushing snowpack caches…"
          curl -fsS -X POST \
            -H "x-revalidate-secret: $REVALIDATE_SECRET" \
            "https://lakepowelldata.com/api/revalidate?tags=snotel,basin-plots" \
            && echo "" \
            || echo "⚠️ revalidate call failed (non-fatal — cache will TTL out)"

  # ============================================
  # Basin Plots Only (manual trigger)
  # ============================================
  basin-plots:
    runs-on: ubuntu-latest
    environment: Production
    if: github.event.inputs.job == 'basin-plots'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        working-directory: ./data-collection
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Update Basin Plots data
        working-directory: ./data-collection
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          echo "📈 Updating Basin Plots data..."
          python -m migrations.import_basin_plots_data
          echo "✅ Basin Plots update complete"

      - name: Revalidate basin-plots cache
        if: success()
        env:
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          curl -fsS -X POST \
            -H "x-revalidate-secret: $REVALIDATE_SECRET" \
            "https://lakepowelldata.com/api/revalidate?tags=basin-plots" \
            && echo "" \
            || echo "⚠️ revalidate call failed (non-fatal — cache will TTL out)"

  # ============================================
  # Water Year Analysis (manual trigger only)
  # Run annually after October 1 when new water year starts
  # ============================================
  water-year-analysis:
    runs-on: ubuntu-latest
    environment: Production
    if: github.event.inputs.job == 'water-year-analysis'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        working-directory: ./data-collection
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Calculate Water Year Analysis
        working-directory: ./data-collection
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          echo "📅 Calculating water year analysis..."
          echo "This analyzes runoff patterns and creates snowpack-to-elevation correlations"
          python -m migrations.calculate_water_year_analysis
          echo "✅ Water year analysis complete"

      - name: Revalidate water-year-analysis cache
        if: success()
        env:
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          curl -fsS -X POST \
            -H "x-revalidate-secret: $REVALIDATE_SECRET" \
            "https://lakepowelldata.com/api/revalidate?tags=water-year-analysis" \
            && echo "" \
            || echo "⚠️ revalidate call failed (non-fatal — cache will TTL out)"

  # ============================================
  # Report Status
  # ============================================
  report:
    runs-on: ubuntu-latest
    needs: [water-data, snowpack-data]
    if: always() && github.event_name == 'schedule'
    
    steps:
      - name: Report status
        run: |
          echo "📋 Data Collection Summary"
          echo "=========================="
          echo "Water Data: ${{ needs.water-data.result }}"
          echo "Snowpack Data: ${{ needs.snowpack-data.result }}"
          echo ""
          if [[ "${{ needs.water-data.result }}" == "success" && "${{ needs.snowpack-data.result }}" == "success" ]]; then
            echo "✅ All data collection jobs completed successfully!"
          else
            echo "⚠️ Some jobs may have issues. Check the logs above."
          fi
